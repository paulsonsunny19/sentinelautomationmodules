name: Validate STAT Next

on:
  pull_request:
    paths:
      - 'src/**'
      - 'modules/**'
      - 'function_app.py'
      - 'requirements.txt'
      - 'infrastructure/**'
      - 'tests/**'
      - 'host.json'
      - '.github/workflows/validate.yml'
  push:
    branches: [stat-next]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r src/requirements.txt pytest
      - run: pytest -q
      - run: python -m compileall -q src function_app.py modules

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep install
      - name: Compile core template
        run: az bicep build --file infrastructure/main.bicep --outfile /tmp/main.json
      - name: Compile playbook bootstrap template
        run: az bicep build --file infrastructure/playbook-main.bicep --outfile /tmp/playbook-main.json
      - name: Validate generated ARM JSON
        run: |
          python -m json.tool /tmp/main.json >/dev/null
          python -m json.tool /tmp/playbook-main.json >/dev/null
      - name: Validate native STAT activation ARM template
        run: |
          python -m json.tool infrastructure/playbook-activate.json >/dev/null
          python - <<'PY'
          import json
          p='infrastructure/playbook-activate.json'
          d=json.load(open(p))
          assert d.get('$schema','').endswith('/deploymentTemplate.json#')
          resources=d.get('resources',[])
          wf=next(r for r in resources if r.get('type')=='Microsoft.Logic/workflows')
          actions=wf['properties']['definition']['actions']
          required={'Get_incident_context','Build_STAT_Base','AAD_Risks','Related_Alerts','Threat_Intelligence','MDE','UEBA','File_Insights','Defender_for_Cloud_Apps','Score_STAT','High_Risk'}
          missing=required-set(actions)
          assert not missing, f'Missing STAT actions: {sorted(missing)}'
          assert wf.get('identity',{}).get('type')=='SystemAssigned'
          print('Native STAT activation ARM template is structurally valid')
          PY

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build ready-to-run Linux Consumption ZIP
        run: |
          rm -rf .python_packages package-root
          mkdir -p .python_packages/lib/site-packages package-root/modules artifacts
          pip install --disable-pip-version-check --no-compile -r requirements.txt --target .python_packages/lib/site-packages
          cp function_app.py host.json requirements.txt package-root/
          cp -R modules package-root/
          cp -R .python_packages package-root/
          (cd package-root && zip -X -r ../artifacts/stat-next.zip . -x '*/__pycache__/*' '*.pyc')
      - name: Validate deployment ZIP
        run: |
          unzip -Z1 artifacts/stat-next.zip | grep -qx 'function_app.py'
          unzip -Z1 artifacts/stat-next.zip | grep -qx 'host.json'
          unzip -Z1 artifacts/stat-next.zip | grep -qx 'requirements.txt'
          unzip -Z1 artifacts/stat-next.zip | grep -qx 'modules/sentinel.py'
          unzip -Z1 artifacts/stat-next.zip | grep -q '^.python_packages/lib/site-packages/azure/functions/'
          unzip -Z1 artifacts/stat-next.zip | grep -q '^.python_packages/lib/site-packages/azure/identity/'
          sha256sum artifacts/stat-next.zip

  publish-portal-artifacts:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'stat-next'
    needs: [python, infrastructure, package]
    concurrency:
      group: stat-next-portal-artifacts
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stat-next
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and publish stable Portal artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          az bicep install

          for attempt in 1 2 3; do
            git fetch origin stat-next
            git reset --hard origin/stat-next
            git clean -fdx

            az bicep build --file infrastructure/main.bicep --outfile infrastructure/main.json
            az bicep build --file infrastructure/playbook-main.bicep --outfile infrastructure/playbook-main.json
            python -m json.tool infrastructure/playbook-activate.json >/dev/null

            mkdir -p .python_packages/lib/site-packages package-root/modules artifacts
            pip install --disable-pip-version-check --no-compile -r requirements.txt --target .python_packages/lib/site-packages
            cp function_app.py host.json requirements.txt package-root/
            cp -R modules package-root/
            cp -R .python_packages package-root/
            (cd package-root && zip -X -r ../artifacts/stat-next.zip . -x '*/__pycache__/*' '*.pyc')
            sha256sum artifacts/stat-next.zip | tee artifacts/stat-next.zip.sha256

            git add infrastructure/main.json infrastructure/playbook-main.json infrastructure/playbook-activate.json artifacts/stat-next.zip artifacts/stat-next.zip.sha256
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish validated STAT Next Portal artifacts [skip ci]'
            if git push origin HEAD:stat-next; then exit 0; fi
            echo "Remote changed during publish attempt $attempt; rebuilding from latest tip."
            sleep $((attempt * 2))
          done

          echo 'Failed to publish artifacts after 3 clean rebuild attempts.' >&2
          exit 1
