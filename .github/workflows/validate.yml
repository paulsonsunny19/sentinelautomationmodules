name: Validate STAT Next

on:
  pull_request:
    paths:
      - 'src/**'
      - 'modules/**'
      - 'function_app.py'
      - 'requirements.txt'
      - 'infrastructure/**'
      - 'tests/**'
      - 'host.json'
      - '.github/workflows/validate.yml'
  push:
    branches: [stat-next]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r src/requirements.txt pytest
      - run: pytest -q
      - run: python -m compileall -q src function_app.py modules

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep install
      - run: az bicep build --file infrastructure/main.bicep --outfile /tmp/main.json
      - run: python -m json.tool /tmp/main.json >/dev/null

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate deployment ZIP
        run: |
          mkdir -p artifacts
          zip -X -r artifacts/stat-next.zip function_app.py host.json requirements.txt modules -x '*/__pycache__/*' '*.pyc'
          unzip -Z1 artifacts/stat-next.zip | grep -qx 'function_app.py'
          unzip -Z1 artifacts/stat-next.zip | grep -qx 'host.json'
          unzip -Z1 artifacts/stat-next.zip | grep -qx 'requirements.txt'
          unzip -Z1 artifacts/stat-next.zip | grep -qx 'modules/sentinel.py'
          unzip -Z1 artifacts/stat-next.zip | grep -qx 'modules/related_alerts.py'
          sha256sum artifacts/stat-next.zip

  publish-portal-artifacts:
    if: github.event_name == 'push' && github.ref == 'refs/heads/stat-next' && !contains(github.event.head_commit.message, '[skip ci]')
    needs: [python, bicep, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stat-next
      - name: Build stable Portal artifacts
        run: |
          az bicep install
          az bicep build --file infrastructure/main.bicep --outfile infrastructure/main.json
          mkdir -p artifacts
          zip -X -r artifacts/stat-next.zip function_app.py host.json requirements.txt modules -x '*/__pycache__/*' '*.pyc'
          sha256sum artifacts/stat-next.zip | tee artifacts/stat-next.zip.sha256
      - name: Publish artifacts to stat-next branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add infrastructure/main.json artifacts/stat-next.zip artifacts/stat-next.zip.sha256
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish validated STAT Next Portal artifacts [skip ci]'
          git push origin HEAD:stat-next
